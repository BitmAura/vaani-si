<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANNI — Inbound Telephony Phone Numbers</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th { text-align: left; padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      outline: none;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Business Phone Numbers</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
          Inbound cellular lines routed to autonomous AI Employees.
        </p>
      </div>
      <button class="btn" onclick="alert('Connect Existing Cellular Line: Provide your Exotel / Twilio Virtual Number details in .env')">+ Connect Number</button>
    </header>

    <div class="card">
      <table id="numbersTable">
        <thead>
          <tr>
            <th>Phone Number</th>
            <th>Telephony Provider</th>
            <th>Status</th>
            <th>Assigned AI Employee</th>
            <th>Capabilities</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="font-weight: 600;">+91 80 4719 2001</td>
            <td>Exotel (Bangalore PSTN)</td>
            <td><span class="status-badge">ACTIVE</span></td>
            <td>
              <select onchange="alert('Agent assigned updated.')">
                <option selected>Ballari Real Estate Assistant</option>
                <option>Dr. Kumar Dental Receptionist</option>
              </select>
            </td>
            <td style="color: var(--text-muted); font-size: 0.85rem;">Inbound Calls, Media Streaming</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
