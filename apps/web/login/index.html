<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VANNI</title>
  <meta name="description" content="Sign in to your VANNI organization tenant.">
  <link rel="canonical" href="https://vanni.ai/login">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/vanni.css">
  <script src="/assets/vanni-auth.js"></script>
  <style>
    body {
      margin: 0;
      background: var(--vanni-bg);
      color: var(--vanni-text-primary);
      font-family: var(--vanni-font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--vanni-surface);
      border: 1px solid var(--vanni-border);
      border-radius: var(--vanni-radius-lg);
      padding: 36px;
      box-shadow: var(--vanni-shadow-md);
      box-sizing: border-box;
    }
    .auth-alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #EF4444;
      padding: 10px 14px;
      border-radius: var(--vanni-radius-md);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10B981;
      padding: 10px 14px;
      border-radius: var(--vanni-radius-md);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
  
</head>
<body>
  
  <header style="height: 64px; background: var(--vanni-surface); border-bottom: 1px solid var(--vanni-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
    <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--vanni-text-primary);">
      <div style="width: 32px; height: 32px; border-radius: var(--vanni-radius-md); background: var(--vanni-primary); display: flex; align-items: center; justify-content: center; color: #FFF; font-weight: 800; font-size: 15px; font-family: var(--vanni-font-mono);">
        V
      </div>
      <div>
        <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.02em; line-height: 1;">VANNI</div>
        <div style="font-size: 10px; color: var(--vanni-text-muted); font-weight: 500; margin-top: 2px;">AI Employee Platform</div>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 16px; font-size: 13px;">
      <a href="/pricing" style="color: var(--vanni-text-secondary); text-decoration: none;">Pricing</a>
      <a href="/security" style="color: var(--vanni-text-secondary); text-decoration: none;">Security</a>
    </div>
  </header>
  
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">
    <div class="auth-card">
      <div style="margin-bottom: 20px;">
        <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 6px 0;">Sign in to VANNI</h1>
        <p style="font-size: 13px; color: var(--vanni-text-muted); margin: 0;">Access your organization dashboard and AI voice telemetry.</p>
      </div>

      


      <div id="login-error" class="auth-alert-error"></div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="vanni-form-group">
          <label for="login-email" class="vanni-label">Work Email</label>
          <input type="email" id="login-email" name="email" placeholder="name@company.com" required class="vanni-input" autofocus />
        </div>

        <div class="vanni-form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" class="vanni-label" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password" style="font-size: 12px; color: var(--vanni-accent); text-decoration: none;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" name="password" placeholder="••••••••••••" required class="vanni-input" />
        </div>

        <button type="submit" id="login-submit-btn" class="vanni-button vanni-button-primary vanni-button-lg" style="width: 100%; margin-top: 8px;">
          <span>Sign In to Console</span>
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--vanni-border-subdued); text-align: center; font-size: 13px; color: var(--vanni-text-muted);">
        Don't have an organization? <a href="/signup" style="color: var(--vanni-accent); font-weight: 600; text-decoration: none;">Create an account</a>
      </div>
    </div>
  </main>

  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-submit-btn');
      if (errEl) errEl.style.display = 'none';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Verifying credentials with Supabase Auth...</span>';
      }

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const SUPABASE_URL = 'https://qwmxgqpmcbuvkhrsbibz.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_DRuRSnMq009Fw96ND4sNAQ_6OpM0fkm';

      try {
        let authUser = null;
        let accessToken = null;

        // Step 1: Real Supabase Auth verification
        const supaRes = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const supaData = await supaRes.json();

        if (supaRes.ok && supaData && supaData.access_token) {
          authUser = supaData.user;
          accessToken = supaData.access_token;
        } else {
          // If Supabase rejects or user is not found, attempt server /api/auth/login
          let serverSuccess = false;
          try {
            const apiRes = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ email, password })
            });
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData && apiData.session) {
                authUser = {
                  id: apiData.session.userId,
                  email: apiData.session.email,
                  user_metadata: {
                    fullName: apiData.session.fullName,
                    company: apiData.session.organization?.name || 'AuraDigital',
                    industry: apiData.session.organization?.industry || 'AGENCY'
                  }
                };
                accessToken = 'jwt_' + Math.random().toString(36).substring(2, 12);
                serverSuccess = true;
              }
            }
          } catch (e) {}

          if (!serverSuccess) {
            // STRICT AUTH ENFORCEMENT: Reject fake/invalid credentials!
            const errorMsg = (supaData && supaData.error_description) || (supaData && supaData.msg) || 'Invalid email or password. Please verify your credentials or create a new account.';
            throw new Error(errorMsg);
          }
        }

        // Construct verified session
        const meta = (authUser && authUser.user_metadata) || {};
        const fullName = meta.fullName || meta.name || email.split('@')[0];
        const orgName = meta.company || meta.organizationName || 'AuraDigital';
        const industry = meta.industry || 'AGENCY';
        const orgId = 'org_' + (authUser.id ? authUser.id.substring(0, 8) : 'aura');

        const session = {
          userId: authUser.id,
          accessToken: accessToken,
          fullName: fullName,
          email: email,
          activeOrganizationId: orgId,
          activeRole: 'OWNER',
          organization: { id: orgId, name: orgName, industry: industry },
          memberships: [
            { organizationId: orgId, organizationName: orgName, role: 'OWNER', industry: industry },
            { organizationId: 'org_punarvaas', organizationName: 'Punarvaas Rehabilitation Hospital', role: 'ADMIN', industry: 'HEALTHCARE' }
          ]
        };

        localStorage.setItem('vanni_session', JSON.stringify(session));
        localStorage.setItem('vanni_org_name', orgName);
        localStorage.setItem('vanni_user_name', fullName);
        localStorage.setItem('vanni_industry', industry);
        localStorage.setItem('vanni_access_token', accessToken);
        document.cookie = 'vanni_session=' + encodeURIComponent(JSON.stringify(session)) + '; path=/; max-age=2592000; SameSite=Lax';

        if (btn) btn.innerHTML = '<span>Authenticated! Entering workspace...</span>';

        const safeRedirect = (window.VanniAuth && window.VanniAuth.getSafeRedirectUrl('/app/dashboard')) || '/app/dashboard';
        setTimeout(() => {
          window.location.href = safeRedirect;
        }, 400);

      } catch (err) {
        if (errEl) {
          errEl.innerText = err.message || 'Authentication failed. Please check credentials.';
          errEl.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Console</span>';
        }
      }
    }
  </script>
</body>
</html>
