    function renderIndustrySteps(industryKey, companyName) {
      const template = INDUSTRY_TEMPLATES[industryKey] || INDUSTRY_TEMPLATES.REAL_ESTATE;

      // Update Header & Badge
      const badgeEl = document.getElementById('onboarding-industry-badge');
      if (badgeEl) {
        badgeEl.innerText = template.badge;
      }

      document.getElementById('onboarding-title').innerText = template.title;
      document.getElementById('onboarding-sub').innerText = template.subtitle;

      const container = document.getElementById('industry-steps-container');
      container.innerHTML = `
        <!-- Step 1 -->
        <div class="step-card">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <div style="width: 28px; height: 28px; border-radius: 8px; background: #2563EB; color: #FFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">1</div>
            <div>
              <h2 style="font-size: 16px; font-weight: 700; margin: 0;">${template.step1Title}</h2>
              <div style="font-size: 12px; color: #64748B;">${template.step1Sub}</div>
            </div>
          </div>
          ${template.step1Html}
        </div>

        <!-- Step 2 -->
        <div class="step-card">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <div style="width: 28px; height: 28px; border-radius: 8px; background: #2563EB; color: #FFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">2</div>
            <div>
              <h2 style="font-size: 16px; font-weight: 700; margin: 0;">${template.step2Title}</h2>
              <div style="font-size: 12px; color: #64748B;">${template.step2Sub}</div>
            </div>
          </div>
          ${template.step2Html}
        </div>

        <!-- Step 3 -->
        <div class="step-card">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <div style="width: 28px; height: 28px; border-radius: 8px; background: #2563EB; color: #FFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">3</div>
            <div>
              <h2 style="font-size: 16px; font-weight: 700; margin: 0;">${template.step3Title}</h2>
              <div style="font-size: 12px; color: #64748B;">${template.step3Sub}</div>

      `;

    async function initOnboarding() {
      let session = null;
      try {
        const res = await fetch('/api/auth/session');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) session = data.session;
        }
      } catch (e) {}

      if (!session) {
        try {
          const raw = localStorage.getItem('vanni_session');
          if (raw) session = JSON.parse(raw);
        } catch(e) {}
      }

      const orgName = session?.activeOrganizationName || session?.memberships?.[0]?.organizationName || localStorage.getItem('vanni_org_name') || 'Your Business';
      const rawIndustry = session?.memberships?.[0]?.industry || localStorage.getItem('vanni_industry') || 'REAL_ESTATE';

      const orgBadge = document.getElementById('header-org-badge');
      if (orgBadge) orgBadge.innerText = orgName;

      const raw = (rawIndustry || '').toUpperCase();
      const name = (orgName || '').toUpperCase();

      if (raw.includes('AGENCY') || name.includes('AGENCY') || name.includes('MARKETING')) {
        detectedIndustry = 'AGENCY';
      } else if (raw.includes('HOSPITAL') || raw.includes('DENTAL') || raw.includes('HEALTHCARE') || raw.includes('CLINIC') || name.includes('HOSPITAL') || name.includes('CLINIC') || name.includes('CARE') || name.includes('HEALTH') || name.includes('DOCTOR')) {
        detectedIndustry = 'HEALTHCARE_HOSPITAL';
      } else {
        detectedIndustry = 'REAL_ESTATE';
      }

      renderIndustrySteps(detectedIndustry, orgName);
    }

    async function completeOnboarding() {
      const btn = document.getElementById('btn-complete-setup');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-pulse">Saving Knowledge Brain...</span>';
      }

      try {
        if (!activeSession) {
          const res = await fetch('/api/auth/session');
          const data = await res.json();
          if (data.authenticated) activeSession = data.session;
        }

        if (activeSession) {
          const orgId = activeSession.activeOrganizationId;
          await fetch(`/api/orgs/${orgId}/onboarding`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'ready', industry: detectedIndustry })
          });
        }
        localStorage.setItem('vanni_onboarding_completed', 'true'); window.location.href = '/app/dashboard';
      } catch (err) {
        window.location.href = '/app/dashboard';
      }
    }

    window.addEventListener('DOMContentLoaded', initOnboarding);

</html>
